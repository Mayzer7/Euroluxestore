{% comment %} {% load static %}

<head>
    <link rel="stylesheet" href="{% static 'deps/css/modal_card.css' %}">
</head>

<body>
    <!-- Модальное окно для сообщений и ошибок -->
    <div id="messageModal" class="modal">
        <div class="modal-content" id="messageContent">
            <p id="messageText"></p>
            <ul id="errorList"></ul> <!-- Здесь будут ошибки формы -->
        </div>
    </div>

    {% if messages or form.errors %}
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                let messages = [
                    {% for message in messages %}
                        { text: "{{ message }}", level: "{{ message.tags }}" },
                    {% endfor %}
                ];

                let errors = [
                    {% for field, error_list in form.errors.items %}
                        {% for error in error_list %}
                            "{{ error }}",
                        {% endfor %}
                    {% endfor %}
                ];

                if (messages.length > 0 || errors.length > 0) {
                    let modal = document.getElementById("messageModal");
                    let messageText = document.getElementById("messageText");
                    let errorList = document.getElementById("errorList");

                    // Отображение сообщений
                    messageText.textContent = messages.map(msg => msg.text).join("\n");

                    // Добавляем ошибки формы в список
                    errorList.innerHTML = errors.map(err => `<li>${err}</li>`).join("");

                    // Показываем модалку
                    modal.classList.add("show");

                    // Автоматическое скрытие через 5 секунд
                    setTimeout(() => {
                        modal.classList.remove("show");
                    }, 5000);
                }
            });
        </script>
    {% endif %}
</body> {% endcomment %}
