{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block css %}
        <link rel="stylesheet" href="{% static "deps/css/test.css" %}">
    {% endblock css %}

    <title>{{ title }}</title>
    <style>
        @font-face {
            font-family: 'Gotham Pro';
            src: url('{% static "fonts/GothamPro-Regular.woff2" %}') format('woff2'),
                 url('{% static "fonts/GothamPro-Regular.woff" %}') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Gotham Pro';
            src: url('{% static "fonts/GothamPro-Bold.woff2" %}') format('woff2'),
                 url('{% static "fonts/GothamPro-Bold.woff" %}') format('woff');
            font-weight: bold;
            font-style: normal;
        }
    </style>
</head>
<body>
    {% block header %}
        {% include "includes/header.html" %}
    {% endblock %}

    {% block notifications %}
        {% include "includes/notifications.html" %}
    {% endblock %}

    {% block content %}

    {% endblock %}
</body>
</html>
