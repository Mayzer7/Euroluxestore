{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block css %}
        <link rel="stylesheet" href="{% static "deps/css/main.css" %}">
    {% endblock css %}

    <!-- Favicons для разных платформ -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static "deps/favicon/apple-touch-icon.png" %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static "deps/favicon/favicon-32x32.png" %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static "deps/favicon/favicon-16x16.png" %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static "deps/favicon/android-chrome-192x192.png" %}">
    <link rel="icon" type="image/x-icon" sizes="48x48" href="{% static 'deps/favicon/favicon.ico' %}">

    <title>{{ title }}</title>
</head>
<body>
    {% block header %}
        {% include "includes/header.html" %}
    {% endblock %}

    {% block notifications %}
        {% include "includes/notifications.html" %}
    {% endblock %}

    <!-- БУРГЕР -->
    <div class="wrapper" style="display: none">
        <header>
          <div class="header-container">
            <div class="logo-and-desc">
              <div class="left">
                <h1>EUROLUXE</h1>
              </div>
              <div class="right">
                <button class="close-btn" aria-label="Close">
                  <img class="close-img" src="{% static 'deps/icons/close-gray.svg' %}" alt="close"/>
                </button>
              </div>
            </div>
          </div>
        </header>
    
        <main>
          <div class="navigate-items">
            <button class="navigate-item expandable">
                <div class="navigate-content">
                  <div class="navigate-name">Каталог</div>
                  <div class="navigate-icon">
                    <img src="{% static 'deps/icons/Ellipse.svg' %}" alt="icon" />
                  </div>
                </div>
                <div class="navigate-line"></div>
                <div class="sub-items">
                    {% for category in categories %}
                        <a class="sub-item" href="{% url "goods:catalog" %}?category={{ category.slug }}">{{ category.name }}</a>
                    {% endfor %}
                </div>
            </button>
    
            <a href="{% url "goods:catalog" %}?sort=discount" class="navigate-item expandable">
                <div class="navigate-content">
                  <div class="navigate-name">По скидке</div>
                  <div class="navigate-icon">
                    <img src="{% static 'deps/icons/Ellipse.svg' %}" alt="icon" />
                  </div>
                </div>
                <div class="navigate-line"></div>
            </a>

            <a href="{% url "main:index" %}#new-collection" class="navigate-item expandable">
                <div class="navigate-content">
                  <div class="navigate-name">Новая коллекция</div>
                  <div class="navigate-icon">
                    <img src="{% static 'deps/icons/Ellipse.svg' %}" alt="icon" />
                  </div>
                </div>
                <div class="navigate-line"></div>
            </a>

            <a href="{% url "main:index" %}#reviews" class="navigate-item expandable">
                <div class="navigate-content">
                  <div class="navigate-name">Отзывы</div>
                  <div class="navigate-icon">
                    <img src="{% static 'deps/icons/Ellipse.svg' %}" alt="icon" />
                  </div>
                </div>
                <div class="navigate-line"></div>
            </a>
        </main>
    
        <footer class="contact-footer">
          <div class="contact-container">
            <!-- Профиль -->
            <button class="callback-btn" onclick="window.location.href='{% if user.is_authenticated %}{% url 'users:profile' %}{% else %}{% url 'users:login' %}{% endif %}'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none">
                    <path fill="currentColor" d="M12 1.875A10.125 10.125 0 1 0 22.125 12 10.137 10.137 0 0 0 12 1.875M7.46 18.428a5.625 5.625 0 0 1 9.08 0 7.85 7.85 0 0 1-9.08 0m1.915-7.178a2.625 2.625 0 1 1 5.25 0 2.625 2.625 0 0 1-5.25 0m8.813 5.62a7.8 7.8 0 0 0-2.72-2.196 4.875 4.875 0 1 0-6.937 0 7.8 7.8 0 0 0-2.719 2.195 7.875 7.875 0 1 1 12.366 0h.01Z"/>
                </svg>
                Профиль
            </button>

            <!-- Корзина -->
            <button class="callback-btn" onclick="window.location.href='{% url 'carts:cart_view' %}'">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none">
                    <path fill="currentColor" d="M9.375 20.25a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0m7.875-1.875a1.875 1.875 0 1 0 0 3.75 1.875 1.875 0 0 0 0-3.75m4.825-11.294-2.558 8.316a2.61 2.61 0 0 1-2.51 1.853H7.775a2.64 2.64 0 0 1-2.525-1.904L2.045 4.125h-.92a1.125 1.125 0 0 1 0-2.25h1.202a1.88 1.88 0 0 1 1.803 1.36l.683 2.39H21a1.125 1.125 0 0 1 1.075 1.456m-2.598.794H5.455l1.959 6.853a.375.375 0 0 0 .36.272h9.233a.375.375 0 0 0 .36-.264z"/>
                </svg>
                Корзина
            </button>

          </div>
        </footer>
    </div>

    {% block content %}

    {% endblock %}

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const expandableItems = document.querySelectorAll('.navigate-item.expandable');
          
            const activeSvg = `
              <svg width="5" height="5" viewBox="0 0 5 5" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="2.36486" cy="2.5" rx="2.36486" ry="2.5" fill="#202020"/>
              </svg>
            `;
          
            const defaultSvg = `
              <svg width="5" height="5" viewBox="0 0 5 5" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="2.5" cy="2.5" r="2.5" fill="#E5E5E5"/>
              </svg>
            `;
          
            expandableItems.forEach(item => {
              const content = item.querySelector('.navigate-content');
              const iconWrapper = item.querySelector('.navigate-icon');
          
              content.addEventListener('click', () => {
                const isAlreadyActive = item.classList.contains('active');
          
                expandableItems.forEach(otherItem => {
                  otherItem.classList.remove('active');
                  const otherIcon = otherItem.querySelector('.navigate-icon');
                  if (otherIcon) {
                    otherIcon.innerHTML = defaultSvg;
                  }
                });
          
                if (!isAlreadyActive) {
                  item.classList.add('active');
                  iconWrapper.innerHTML = activeSvg;
                }
              });
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            const burger = document.querySelector(".burger");
            const wrapper = document.querySelector(".wrapper");
            const closeBtn = document.querySelector(".close-btn");
            const header = document.querySelector(".header");
            const content = document.querySelector(".content-container");

            if (burger && wrapper && closeBtn && header && content) {
                burger.addEventListener("click", function () {
                    wrapper.style.display = "flex";
                    header.style.display = "none";
                    content.style.display = "none";
                    document.body.style.overflow = "hidden";
                });
        
                closeBtn.addEventListener("click", function () {
                    wrapper.style.display = "none";
                    header.style.display = ""; // вернёт как было (block/flex и т.д.)
                    content.style.display = "block";
                    document.body.style.overflow = "";
                });
            }
        });

        document.getElementById("search-input").addEventListener("keypress", function(event) {
            // Проверяем, была ли нажата клавиша Enter (код клавиши 13)
            if (event.key === "Enter") {
                this.form.submit();  // Отправляем форму
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            function updateCartCount() {
                fetch("{% url 'carts:cart_count' %}", {
                    method: "GET",
                    headers: {
                        "X-Requested-With": "XMLHttpRequest",
                    }
                })
                .then(response => response.json())
                .then(data => {
                    const cartCount = document.querySelector(".cart-count");
                    if (cartCount) {
                        cartCount.textContent = data.cart_count;
                    }
                })
                .catch(error => console.error("Ошибка обновления корзины:", error));
            }
        });
    </script>
    
    

</body>
</html>
