<h4>Товары:</h4>
<div class="order-items">
    {% for item in order.items.all %}
        <div class="order-item">
            <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}" width="100">
            <p>{{ item.product.name }} ({{ item.quantity }} шт.)</p>
        </div>
    {% endfor %}
</div>
<p>Сумма: {{ order.total_price }} ₽</p>
