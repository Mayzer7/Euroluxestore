{% extends "base.html" %}
{% block content %}
    <h1>Ваша корзина</h1>
    {% if cart_items %}
        <ul>
            {% for item in cart_items %}
                <li>
                    <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}" style="width: 50px; height: 50px;">
                    {{ item.product.name }} - {{ item.quantity }} шт. - {{ item.total_price }} ₽
                </li>
            {% endfor %}
        </ul>
        <p>Итого: {{ total_price }} ₽</p>
    {% else %}
        <p>Корзина пуста.</p>
    {% endif %}
{% endblock %}
