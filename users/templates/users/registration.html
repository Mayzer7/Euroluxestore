{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "deps/css/registration.css" %}">
    <title>Page With Background Video | AsmrProg</title>
</head>

<body>


    <div class="container">
        <video src="{% static "deps/videos/bg.mp4" %}" autoplay loop playsinline muted></video>


        <div class="background">
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <h3>Зарегистрируйтесь</h3>
    
            <label for="username">Имя пользователя</label>
            <input type="text" id="username">

            <label for="email">Почта</label>
            <input type="email" id="email">
    
            <label for="password">Пароль</label>
            <input type="password" id="password">

            <label for="password">Повторный пароль</label>
            <input type="password" id="password2">
    
            <a href="{% url 'users:registration' %}" class="reg-button">Зарегистрироваться</a>                       
        </form>
    
    </div>


</body>

</html>
